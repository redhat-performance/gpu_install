---
- name: Install GPU driver repository
  community.general.zypper:
    pkg:
      - "{{ download_url }}"
    state: present
    disable_gpg_check: true
  when: not gpu_install_dry_run

- name: Determine kernel version and variant
  ansible.builtin.set_fact:
    kernel_variant: "{{ (ansible_kernel | split('-'))[-1] }}"
    kernel_version: "{{ (ansible_kernel | split('-'))[0] }}"

- name: Install required packages/repos
  community.general.zypper:
    pkg:
      - kernel-{{ kernel_variant }}-devel-{{ kernel_version }}
    auto_import_keys: true
    state: present
  when: not gpu_install_dry_run

- name: Install Nvidia drivers
  community.general.zypper:
    name:
      - "cuda-drivers"
  notify:
    - Reboot system
  when: not gpu_install_dry_run

- name: Install CUDA
  when: not gpu_install_dry_run and gpu_install_library
  block:
    - name: Install CUDA repo
      ansible.builtin.get_url:
        dest: /etc/zypp/repos.d/cuda-sles{{ ansible_distribution_major_version }}.repo
        url: "{{ lookup('ansible.builtin.template', 'nvidia/cuda_rpm_repo.j2', template_vars={'distro': 'sles'}) }}"
        mode: "0644"
        owner: root
        group: root

    - name: Install CUDA
      community.general.zypper:
        pkg:
          - cuda-toolkit-{{ gpu_install_library_version | replace('.', '-') }}
        state: present
        auto_import_keys: true
